name: android

# Compila la app de la tablet (Rupert Tablet) sin laptop.
# - En cada PR/push que toque android/: sube el APK como artifact.
# - En main: además publica/actualiza el release "tablet-latest" para descargarlo desde la tablet.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rupert-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Descargar modelos de openWakeWord
        run: |
          set -e
          dest=android/app/src/main/assets/wakeword
          mkdir -p "$dest"
          base=https://github.com/dscripka/openWakeWord/releases/download/v0.5.1
          for f in melspectrogram.tflite embedding_model.tflite hey_jarvis_v0.1.tflite; do
            curl -fsSL --retry 3 -o "$dest/$f" "$base/$f"
          done
          mv "$dest/hey_jarvis_v0.1.tflite" "$dest/hey_jarvis.tflite"
          ls -la "$dest"

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/rupert-tablet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rupert-tablet-apk
          path: dist/rupert-tablet.apk
          retention-days: 14

      - name: Publicar release tablet-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete tablet-latest --yes --cleanup-tag || true
          gh release create tablet-latest dist/rupert-tablet.apk \
            --title "Rupert Tablet (último build)" \
            --notes "APK de la app de la tablet, build ${{ github.run_number }} (${{ github.sha }}). Descárgalo desde la tablet e instálalo; cada build nuevo actualiza al anterior." \
            --prerelease
